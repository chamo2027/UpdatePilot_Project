services:
  # UpdatePilot Backend API Server
  - type: web
    name: updatepilot-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm --workspace=@updatepilot/shared run build && npm --workspace=@updatepilot/server run db:generate && npm --workspace=@updatepilot/server run build
    preDeployCommand: npx prisma db push --schema=apps/server/prisma/schema.prisma --accept-data-loss
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENT_PAIRING_CODE
        generateValue: true
      - key: ENABLE_OSV_ADVISORIES
        value: "true"
      - key: DASHBOARD_ORIGIN
        sync: false
